# .github/actions/docker-publish/action.yml
name: 'Publish Docker Images'
description: 'Publish previously built Docker images to a container registry using tags produced by docker-build.'
inputs:
    images:
        description: 'Image metadata JSON generated by docker-build (array of {name, fullImageName, versionTag}).'
        required: true
    registry:
        description: 'Container registry hostname.'
        required: true
    registry-username:
        description: 'Username used for registry authentication.'
        required: false
    registry-password:
        description: 'Password or token used for registry authentication.'
        required: false
    additional-tags:
        description: |
            Optional newline-separated list of additional tags to apply (e.g. "latest" or "main").
        required: false
        default: ''
outputs:
    published-images:
        description: 'JSON metadata describing successfully pushed images.'
        value: ${{ steps.push-images.outputs.published-images }}
runs:
    using: "composite"
    steps:
        -   name: Authenticate to registry
            shell: bash
            run: |
                echo "${REGISTRY_PASSWORD}" | docker login "${{ inputs.registry }}" \
                    --username "${{ inputs.registry-username }}" \
                    --password-stdin
            env:
                REGISTRY_PASSWORD: ${{ inputs.registry-password }}

        -   name: Push images
            id: push-images
            shell: bash
            run: |
                set -euo pipefail

                IMAGES_JSON='${{ inputs.images }}'
                PUBLISHED=()

                # Iterate over each image entry
                COUNT=$(echo "${IMAGES_JSON}" | jq 'length')
                for i in $(seq 0 $((COUNT - 1))); do
                    FULL_IMAGE=$(echo "${IMAGES_JSON}" | jq -r ".[$i].fullImageName")
                    VERSION_TAG=$(echo "${IMAGES_JSON}" | jq -r ".[$i].versionTag")
                    NAME=$(echo "${IMAGES_JSON}" | jq -r ".[$i].name")

                    # Verify image exists locally before pushing
                    if ! docker image inspect "${FULL_IMAGE}" > /dev/null 2>&1; then
                        echo "ERROR: Image ${FULL_IMAGE} does not exist locally. Cannot push."
                        exit 1
                    fi

                    echo "Pushing ${FULL_IMAGE}"
                    docker push "${FULL_IMAGE}"

                    APPLIED_TAGS_JSON="[\"${FULL_IMAGE}\"]"

                    # Apply and push additional tags
                    while IFS= read -r tag; do
                        [[ -z "$tag" ]] && continue
                        BASE="${FULL_IMAGE%:*}"
                        TAGGED="${BASE}:${tag}"
                        docker tag "${FULL_IMAGE}" "${TAGGED}"
                        docker push "${TAGGED}"
                        APPLIED_TAGS_JSON=$(echo "${APPLIED_TAGS_JSON}" | jq --arg t "${TAGGED}" '. + [$t]')
                    done <<< "${{ inputs.additional-tags }}"

                    ENTRY=$(jq -n \
                        --arg name        "${NAME}" \
                        --arg fullImage   "${FULL_IMAGE}" \
                        --arg versionTag  "${VERSION_TAG}" \
                        --argjson applied "${APPLIED_TAGS_JSON}" \
                        '{name: $name, fullImageName: $fullImage, versionTag: $versionTag, appliedTags: $applied}')
                    PUBLISHED+=("${ENTRY}")
                done

                # Build published-images JSON array
                PUBLISHED_JSON=$(printf '%s\n' "${PUBLISHED[@]}" | jq -s '.')
                echo "published-images=${PUBLISHED_JSON}" >> "$GITHUB_OUTPUT"
