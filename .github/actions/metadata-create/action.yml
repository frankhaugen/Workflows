# .github/actions/metadata-create/action.yml
name: 'Create Release Metadata'
description: 'Produce a deterministic release metadata document describing artifacts and their provenance.'
inputs:
    service-name:
        description: 'Logical service identifier.'
        required: true
    version:
        description: 'Release version derived from tag (e.g. 2026.3.8.1).'
        required: true
    images:
        description: 'Image metadata JSON generated by docker-build or docker-publish.'
        required: false
        default: '[]'
    commit-sha:
        description: 'Git commit SHA used to produce the release.'
        required: false
        default: '${{ github.sha }}'
outputs:
    metadata-file:
        description: 'Path to the generated metadata JSON file.'
        value: ${{ steps.create-metadata.outputs.metadata-file }}
runs:
    using: "composite"
    steps:
        -   name: Create metadata document
            id: create-metadata
            shell: bash
            run: |
                set -euo pipefail

                SERVICE="${{ inputs.service-name }}"
                VERSION="${{ inputs.version }}"
                COMMIT="${{ inputs.commit-sha }}"
                CREATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

                METADATA_DIR="${GITHUB_WORKSPACE}/.release-metadata"
                mkdir -p "${METADATA_DIR}"
                METADATA_FILE="${METADATA_DIR}/${SERVICE}-${VERSION}-metadata.json"

                IMAGES_JSON='${{ inputs.images }}'

                # Convert images array [{name, fullImageName}] → {name: fullImageName} map
                IMAGES_MAP=$(echo "${IMAGES_JSON}" | jq 'if type == "array" then map({(.name): .fullImageName}) | add // {} else {} end')

                jq -n \
                    --arg service    "${SERVICE}" \
                    --arg version    "${VERSION}" \
                    --arg commit     "${COMMIT}" \
                    --arg createdAt  "${CREATED_AT}" \
                    --argjson images "${IMAGES_MAP}" \
                    '{service: $service, version: $version, commit: $commit, images: $images, createdAt: $createdAt}' \
                    | tee "${METADATA_FILE}"

                echo "metadata-file=${METADATA_FILE}" >> "$GITHUB_OUTPUT"
